# 民謡レーダー UI設計（言葉のみ）
# 対応するUX: spec/ux.yaml / 企画: doc/CONCEPT.md
# 原則: 画面はレーダーが主役。UIは歩行の邪魔をしない

meta:
  app: 民謡レーダー
  style: 静かで、夜の水面のような画面。情報量は最小、光で語る
  screens_count: 実質3画面（レーダー／スポット／コレクション）。遷移より状態変化で見せる

visual_language:
  colors:
    base: 深い藍色から黒へのグラデーション（夜・水・土の色）
    radar_line: 淡い緑の走査線。回転はゆっくり、1周8秒
    spot_light: 温かい琥珀色の光。歌の灯り
    medal: 真鍮から金へ。獲得したものだけが色を持つ
    badge_gold: 県章バッジ専用の金。画面でいちばん明るい色
    text: 生成り色。純白は使わない（眩しさで歩行を邪魔しない）
  typography:
    font: 明朝系を主に（土地の記憶・記録の質感）。数字と操作系だけゴシック
    size: 本文は大きめ。歩きながらでも読める最小サイズを守る
    vertical: スポットの解説は縦書き表示も選べる（歌詞・民謡の世界の呼吸）
  motion:
    radar_sweep: 一定速度で回り続ける。止めない（止まると不安になる）
    spot_appear: 点はフェードで滲むように現れる。ポップアップは禁止
    medal_get: メダルは上から静かに落ちて手元に収まる。派手な演出はしない
    badge_complete: 7枚のメダルがゆっくり集まって県章の形に溶け合い、金になる
  sound_ui:
    note: UIの効果音も画面の一部として設計する
    detect: 小さな鈴のような音が一度だけ
    arrive: 歌へクロスフェード。UI音は消える
    ng: ゲーム風のファンファーレ、連続した通知音

screens:
  - id: radar
    name: レーダー画面（ホーム）
    layout:
      center: 画面中央に大きな円いレーダー。同心円3重、走査線が回る
      top: 県名だけを小さく（現在地の都道府県）。住所や地図は出さない
      bottom: 獲得数だけを静かに「メダル 12 / バッジ 1」
      edges: 何も置かない。余白が歩行中の視界を守る
    components:
      - name: スポットの点
        look: 琥珀色の淡い光。近いほど大きく明るい。方向はレーダー上の方位そのもの
        label: 点のそばに距離だけ「2.3 km」。それ以外の情報は出さない（ドラゴンレーダーのシンプルさ）
        behavior: タップ不可（行くしかない）。通り過ぎると静かに消える
      - name: 圏内の反応
        look: 圏内に入ると点と走査が激しく反応する（点滅の加速・音・振動）。画面全体が「ここだ」と言う
        info: この状態では土地の情報カードが開ける（地誌・歌・昔の生活）
      - name: 獲得済みの点
        look: 静かな青緑に変わり、残り続ける（来た証）
    states:
      empty: 点なし。レーダーだけが回る。「何もない」も体験のうち
      event_boost: 祭りの日は点が少し強く灯る（外部連携の見せ方）

  - id: spot
    name: スポット画面（到着後）
    layout:
      top: 歌の名前と土地の名前。明朝で大きく
      middle: 歌詞と、昔の生活への遡りメモ。縦書き／横書き切替
      player: 再生は大きな丸ボタンひとつ。シークバーは出さない（聴く体験に集中）
      bottom: 獲得したメダルが静かに表示される
    components:
      - name: メダル
        look: 円形。表は歌のテーマのモチーフ（筏・みかん籠・晒し布など歌ごとに違う絵）
        back: 裏返すと歌の一節と一言メモ
      - name: 外部連携リンク
        look: 「祭りで聴く」「音源で聴く」「土地を知る」の3つまで。アイコンでなく言葉で置く

  - id: collection
    name: コレクション画面
    layout:
      view: 日本地図ではなく、47の県章バッジが並ぶ棚として見せる
      order: 地方ごとに行。未獲得は県章の輪郭だけが薄く見える
      medal_list: 県を開くと、その県のメダル7枚が並ぶ。空きは輪郭だけ
    components:
      - name: ゴールドバッジ
        look: 県章を加工した金色。獲得した県だけが灯る
      - name: マスターの間
        look: 47そろったときだけ、棚全体が金に灯る特別な状態

components_common:
  buttons: 丸みのある小さな面。言葉のラベルを基本にし、アイコンだけのボタンは作らない
  tabs: 使わない。3画面はスワイプで行き来する
  notifications: プッシュは祭りの前日など外部連携のときだけ。本文は音声の一言と同じ温度で

accessibility:
  - 片手・歩行中操作が前提。タップ領域は大きく、誤タップしても壊れない
  - 音声案内が主経路なので、画面を見なくても全フローが完走できる
  - 圏内の反応は点滅の速さ・音・振動で表す。画面全体の強いフラッシュは使わない
  - 色だけに頼らない：点の近さは大きさと明るさの両方で伝える

platform:
  form: スマートフォン縦持ち専用（歩きながら片手）
  dark_only: ダークテーマのみ。夜の野外でも眩しくないことが仕様
  offline: スポットデータは県単位で事前に持てる。山間部で圏外でもレーダーは動く

open_questions:
  - 県章の加工デザイン：原形をどこまで残すか（県ごとの許諾確認が前提）
  - メダルのモチーフ絵：歌のテーマからの描き起こし方法（手描き／生成の線引き）
  - 汎用版（音声案内ナビ）とレーダー画面を共有するか、別にするか
