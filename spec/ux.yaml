# 民謡レーダー UX設計（言葉のみ）
# 正本の考え方: doc/CONCEPT.md / データ: data/*.json
# 原則: 地図のリストは見せない。音声が主、画面はレーダーだけ。

meta:
  app: 民謡レーダー
  purpose: 地誌に気づくきっかけになること
  keyword: ゲニウス・ロキ（その土地の記憶・地霊）
  target: ただの観光に満足しない文化的な旅行者
  solves: どこも同じ国道沿いのチェーン店に見えて、大事な違いに気づかないこと

distance_scale:
  base: 32km を距離のベースにする（2026-11-25 本人変更：30km から 32km へ）
  unit: 里で数える。1里 = 4km として、32km = 8里
  note: 昔の旅人は1日 30〜40km（8〜10里）歩いた。8里はその歩行圏の輪。街道には1里ごとに里塚が置かれた
  segment: 宿場と宿場の間は 7〜10km（約2里）。スポットの間隔はこの歩行のリズムが目安
  radar_range: レーダーの基本の輪は半径 32km（8里）。輪の中には里塚や小山も少し出す ― 土地の目印が、距離感の手がかりになる
  applies_to: neo-minyo-land 側も同じベース（32km = 8里）

principles:
  - ドラゴンレーダーに似せてよい。シンプルがいちばん強い
  - 現在地から何キロ先にスポットがあるか分かればいい。それ以上は盛らない
  - 音声ファースト。歩きながら耳で使う。画面を注視させない
  - レーダーは「ある」ことだけを伝える。何があるかは行くまで伏せる
  - 偶然の出会い（セレンディピティ）を先に置く。検索させない
  - 歌は土地のメモリー。過去を思い出すヨスガ、失われた生活の記録、感情
  - 外部との連携を価値にする（祭り・観光・音源・自治体データ）
  - UX/UI と DB がすべて。体験はデータ設計から決まる

flow:
  - id: start
    name: 起動
    screen: レーダーだけが静かに回っている。地図もリストもない
    voice: なし（静けさが初期状態）
    action: 歩き出す。それだけでいい

  - id: detect
    name: 反応
    screen: レーダーの縁に、淡い光の点がひとつ現れる。方向と近さだけが分かる
    voice: 「あっちのほうに、何か面白そうなものがあるよ。行ってみない？」
    action: 向かうか、通り過ぎるかは自由。通り過ぎても責めない、点は静かに消える

  - id: approach
    name: 接近
    screen: 点が少しずつ大きく、明るくなる。点のそばに距離（km）だけが出る
    voice: 近づくにつれて短いヒントが一度だけ。「昔、ここで筏を流していたんだ」
    action: 耳を澄まして歩く。道順の案内はしない（徒歩ロジー：自分の足で辿る）

  - id: in_range
    name: 圏内
    screen: 圏内（チェックイン範囲）に入った途端、レーダーが激しく反応する。点滅と音と振動で「ここだ」と分かる
    voice: 「圏内だよ。何かある」
    action: 立ち止まって周りを見る。土地の情報（地誌・昔の生活）もここで読める

  - id: arrive
    name: 到着
    screen: 点が画面の中心で満ちる。チェックイン範囲（スポットごとの radius_m）に入った合図
    voice: 「着いたよ。ここはね…」のあとに、その地の歌が流れ始める
    action: 歌を聴く。歌詞と、その土地の暮らし（苦労と楽しみ）の短い解説が読める

  - id: medal
    name: メダル獲得
    screen: 歌のテーマをモチーフにしたメダルが1枚、手元に落ちる
    voice: 「○○のメダルを手に入れた」
    action: メダルを眺める。裏面には歌の一節と、昔の生活への遡りメモ

  - id: badge
    name: バッジ完成
    screen: 同じ県のメダルが7枚そろうと、県章を加工したゴールドのバッジに変わる
    voice: 「○○県のバッジ、完成」
    action: バッジコレクションに収まる。47県分がマスターへの道

  - id: master
    name: 民謡マスター
    screen: バッジ47個が全部そろったときだけ開く画面
    voice: 「あなたは民謡マスター」
    action: 全国329スポットの踏破記録が一望できる

states:
  radar_empty: 近くに何もない。レーダーは回り続ける。焦らせない
  radar_weak: 遠くに反応。行くかどうかは歩行の流れに任せる
  radar_strong: 近い。音声案内が始まる
  in_spot: チェックイン範囲内。歌と解説の時間
  collected: 獲得済みのスポットは、レーダー上で静かな色に変わる。再訪しても歌は聴ける

voice_lines:
  style: 語りかけるが、説明しすぎない。土地の記憶への敬意を込める
  examples:
    - 「あっちのほうに、何か面白そうなものがあるよ。行ってみない？」
    - 「この辺り、昔はみかんの唄が聞こえたんだ」
    - 「着いたよ。耳を澄まして」
  ng: 時間で急かす言い方／広告的な煽り／地図アプリ風の命令形（距離の km 表示はむしろ必要）

data_needs:
  note: UXはDBの形で決まる。スポット1件に必要な言葉の項目
  spot:
    - song: 歌の名前
    - theme: メダルのモチーフになる歌のテーマ（暮らしの場面）
    - memory: その土地のメモリー（昔の生活への遡り）
    - hint: 接近時に一度だけ流す短いヒント
    - voice_arrive: 到着時の一言
    - radius_m: チェックイン半径
    - links: 外部連携（祭り・観光・音源・自治体アーカイブ）

external_links:
  - 祭り・イベントの日程と重なると、レーダーの反応が強くなる
  - 音源は Spotify / YouTube / 自治体アーカイブへつなぐ（自前で抱えない）
  - 観光情報は既存の地域メディアへ渡す。アプリ内で完結させない

open_questions:
  - 汎用版（音声案内ナビ）との画面の共有範囲
  - メダルの絵柄生成：歌のテーマからどう描くか
  - 県章の加工の許諾とデザインルール
