<p>和歌山市を中心にした8里（32km）の輪には、<b>大窪の地搗唄</b>（下津）と<b>みかん摘み唄</b>（有田）、目印の<b>龍門山</b>が入る。11/27のテストは、この輪の中で「点と距離が見える→近づく→圏内反応」を一通り体験できる構成。残り4件（串本節・勝浦節・那智の田楽・河内祭・熊野川筏節）は熊野古道沿いに南へ連なる。</p>
